name: Fetch Credentials from CyberArk CCP

on:
  workflow_dispatch:

jobs:
  get-cyberark-secret:
    runs-on: ubuntu-latest

    env:
      CCP_URL: ${{ secrets.CCP_URL }}
      APP_ID: ${{ secrets.CCP_APP_ID }}
      SAFE: ${{ secrets.CYBERARK_SAFE }}
      OBJECT: ${{ secrets.CYBERARK_OBJECT }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch secret from CyberArk CCP
        id: cyberark
        run: |
          RESPONSE=$(curl -sk -X GET \
          "${CCP_URL}/AIMWebService/api/Accounts?AppID=${APP_ID}&Safe=${SAFE}&Object=${OBJECT}")

          echo "$RESPONSE"

          USERNAME=$(echo "$RESPONSE" | jq -r '.UserName')
          PASSWORD=$(echo "$RESPONSE" | jq -r '.Content')

          echo "::add-mask::$PASSWORD"

          echo "username=$USERNAME" >> $GITHUB_OUTPUT
          echo "password=$PASSWORD" >> $GITHUB_OUTPUT

      - name: Use Credentials
        run: |
          echo "Retrieved User: ${{ steps.cyberark.outputs.username }}"
          # Password is masked
