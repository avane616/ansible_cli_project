name: Fetch Credentials from CyberArk CCP

on:
  workflow_dispatch:

jobs:
  get-cyberark-secret:
    runs-on: self-hosted

    env:
      CCP_URL: ${{ secrets.CCP_URL }}
      APP_ID: ${{ secrets.CCP_APP_ID }}
      SAFE: ${{ secrets.CYBERARK_SAFE }}
      OBJECT: ${{ secrets.CYBERARK_OBJECT }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch secret from CyberArk CCP
        id: cyberark
        shell: bash
        run: |
          set +e

          URL="${CCP_URL}/AIMWebService/api/Accounts?AppID=${APP_ID}&Safe=${SAFE}&Object=${OBJECT}"

          echo "Calling CyberArk CCP..."
          echo "URL: $URL"

          HTTP_CODE=$(curl -k -v \
            --output response.json \
            --write-out "%{http_code}" \
            "$URL")

          RC=$?

          echo "Curl Exit Code: $RC"
          echo "HTTP Status Code: $HTTP_CODE"

          echo "===== RESPONSE ====="
          cat response.json || true
          echo "===================="

          if [ $RC -ne 0 ]; then
            echo "Curl failed with exit code $RC"
            exit $RC
          fi

          USERNAME=$(jq -r '.UserName // empty' response.json)
          PASSWORD=$(jq -r '.Content // empty' response.json)

          if [ -z "$USERNAME" ] || [ -z "$PASSWORD" ]; then
            echo "Failed to extract credentials from CCP response."
            exit 1
          fi

          echo "::add-mask::$PASSWORD"

          echo "username=$USERNAME" >> $GITHUB_OUTPUT
          echo "password=$PASSWORD" >> $GITHUB_OUTPUT

      - name: Use Credentials
        run: |
          echo "Retrieved User: ${{ steps.cyberark.outputs.username }}"
