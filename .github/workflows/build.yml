name: Run Ansible Playbook

on:
  workflow_dispatch:

jobs:
  run-ansible:
    runs-on: self-hosted

    env:
      user: ${{ secrets.SNOW_USER }}
      password: ${{ secrets.SNOW_PASSWORD }}
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Ansible Installation
        run: ansible --version

      - name: Run ServiceNow Playbook
        run: |
          ansible-playbook nutanix_vm_prov/snow_integration.yml
          
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Verify tfvars file
        run: |
          find . -name "*.tfvars"
          ls -ltr terraform/nutanix_vm_iac/

      - name: Terraform Init
        working-directory: terraform/nutanix_vm_iac
        env:
          TF_VAR_prism: ${{ secrets.TF_VAR_PRISM }}
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform/nutanix_vm_iac
        env:
          TF_VAR_prism: ${{ secrets.TF_VAR_PRISM }}
        run: terraform plan -var-file=terraform.tfvars
