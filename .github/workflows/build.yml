name: Run Ansible Playbook

on:
  workflow_dispatch:

jobs:
  run-ansible:
    runs-on: self-hosted

    env:
      user: ${{ secrets.SNOW_USER }}
      password: ${{ secrets.SNOW_PASSWORD }}
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Ansible Installation
        run: ansible --version
