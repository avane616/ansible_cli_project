    - name: Include required variables
      block:
        - include_vars: vars.yml
          no_log: true

        # - name: Clean PAT
        #   set_fact:
        #     clean_azpat: "{{ azpat | trim | replace('\n', '') }}"
        #   no_log: true

      rescue:
        - debug:
            msg: "{{ Variables are not configured properly }}" 
            
    - name: Get variable mappings for each RITM with display values
      uri:
        url: "{{ servicenow_instance }}/api/now/table/sc_item_option_mtom?sysparm_query=request_item.number={{ ritm_number }}&sysparm_display_value=true"
        method: GET
        user: "{{ lookup('env', 'user') }}"
        password: "{{ lookup('env', 'password') }}"
        force_basic_auth: yes
        return_content: yes
        headers:
          Accept: "application/json"
      register: mtom_response

    - name: Show mtom response
      debug: 
        msg: "{{ mtom_response }}"

    - name: Extract variable sys_ids from sc_item_option links
      set_fact:
        variable_ids: "{{ mtom_response.json.result | map(attribute='sc_item_option.display_value') | list }}"

    - name: Get variable values with item_option details
      uri:
        url: "{{ servicenow_instance }}/api/now/table/sc_item_option?sysparm_query=sys_idIN{{ variable_ids | join(',') }}&sysparm_display_value=true"
        #url: "{{ servicenow_instance }}/api/now/table/sc_item_option?sysparm_query=sys_idIN{{ variable_ids | join(',') }}&sysparm_display_value=true&sysparm_fields=sys_id,value,item_option"
        method: GET
        user: "{{ lookup('env', 'user') }}"
        password: "{{ lookup('env', 'password') }}"
        force_basic_auth: yes
        return_content: yes
        headers:
          Accept: "application/json"
      register: variable_response

    - name: Debug variable response structure
      debug:
        var: variable_response.json.result

    - name: Map variable names to their values (excluding empty values)
      set_fact:
        variable_map: >-
          {{
            dict(
              variable_response.json.result
              | selectattr('value', 'defined')
              | selectattr('value', '!=', '')
              | map(attribute='sys_id')
              | zip(
                  variable_response.json.result
                  | selectattr('value', 'defined')
                  | selectattr('value', '!=', '')
                  | map(attribute='value')
                )
            )
          }}

    # - name: Map variable names to their values (excluding empty values)
    #   set_fact:
    #     variable_map: >-
    #       {{
    #         dict(
    #           variable_response.json.result
    #           | selectattr('value', 'defined')
    #           | selectattr('value', '!=', '')
    #           | map(attribute='item_option_new.display_value')
    #           | zip(
    #               variable_response.json.result
    #               | selectattr('value', 'defined')
    #               | selectattr('value', '!=', '')
    #               | map(attribute='value')
    #             )
    #         )
    #       }}

    - name: Show variable name-value map
      debug:
        msg: "{{ variable_map }}"

    - name: Set ChangeNumber from RITM response
      set_fact:
        ChangeNumber: "{{ ritm_number }}"

    - name: Get RITM record by number (on success)
      uri:
        url: "{{ servicenow_instance }}/api/now/table/sc_req_item?sysparm_query=number={{ ritm_number }}"
        method: GET
        user: "{{ lookup('env', 'user') }}"
        password: "{{ lookup('env', 'password') }}"
        force_basic_auth: yes
        headers:
          Content-Type: "application/json"
        return_content: yes
        status_code: 200
      register: ritm_lookup_success

    - name: Get Catalog Tasks for RITM
      uri:
        url: "{{ servicenow_instance }}/api/now/table/sc_task?sysparm_query=assignment_group={{ assignment_group }}^request_item={{ ritm_lookup_success.json.result[0].sys_id }}"
        method: GET
        user: "{{ lookup('env', 'user') }}"
        password: "{{ lookup('env', 'password') }}"
        force_basic_auth: yes
        headers:
          Content-Type: "application/json"
        return_content: yes
        status_code: 200
      register: catalog_tasks

    - name: Display Catalog task details
      debug:
        msg: "{{ catalog_tasks }}"

